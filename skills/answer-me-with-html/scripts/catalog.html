<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>对话目录</title>
<style>
:root{color-scheme:light;--bg:#faf8f2;--ink:#35332e;--muted:#817b70;--line:#e5dfd2;--accent:#9b4b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1000px;margin:36px auto;padding:0 24px}header{display:flex;gap:16px;align-items:center;margin-bottom:20px}h1{font:22px/1.5 Georgia,"Noto Serif CJK SC",serif;margin:0;white-space:nowrap}input,button{font:inherit}input{min-width:0;flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:4px;background:#fffdf8;color:var(--ink)}button{cursor:pointer;border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 7px}button:hover,a:hover{color:var(--accent)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.toolbar{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:12px}.toolbar #count{margin-right:auto}details>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:9px;min-width:0}summary::-webkit-details-marker{display:none}summary::before{content:'▸';color:var(--muted);flex-shrink:0}details[open]>summary::before{content:'▾'}.session{border-top:1px solid var(--line);padding:10px 0}.session>summary{padding:5px 0;font-weight:600}.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.badge{font-size:11px;color:var(--muted);font-weight:400;flex-shrink:0;margin-left:auto}.turns{border-left:1px solid var(--line);margin:8px 0 8px 5px;padding-left:20px}.turn{position:relative}.turn::before{position:absolute;content:'';left:-21px;top:21px;width:12px;border-top:1px solid var(--line)}.turn>summary{padding:9px 0;gap:8px}.number{color:var(--muted);font:11px/1.5 ui-monospace,monospace;min-width:23px;flex-shrink:0}.date{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;flex-shrink:0}.conversation{padding:4px 0 14px 25px;max-width:850px}.message{margin:8px 0 18px}.role{font-size:11px;color:var(--muted);margin-bottom:5px}.message.user .body{color:var(--ink);font-weight:500}.body{overflow-wrap:anywhere}.body p{white-space:pre-wrap;margin:6px 0}.body pre{padding:12px;background:#f0ece2;border:1px solid var(--line);border-radius:3px;overflow:auto;font-size:12px;line-height:1.6}.body code{font-family:ui-monospace,monospace;font-size:.9em;background:#f0ece2;padding:1px 3px}.body pre code{padding:0}.turn-pages{display:inline-flex;gap:5px;flex-shrink:0;max-width:36%;overflow-x:auto;white-space:nowrap;font-size:11px}.turn-page{padding:0 4px;border:1px solid var(--line);border-radius:3px;line-height:1.7}.turn-page:hover{border-color:var(--accent);text-decoration:none}.load-more{display:block;margin:8px 0 10px 24px;color:var(--accent);padding:5px 0}.load-more:disabled{cursor:wait;color:var(--muted)}.note{font-size:12px;color:var(--muted)}.legacy{padding:6px 0 6px 24px}.legacy a{display:block;padding:5px 0}mark{background:#f4dfad;color:inherit}#status{color:var(--accent);font-size:12px}.ids{font:10px/1.6 ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere;margin-top:10px}.ids summary{font-family:system-ui;font-size:11px}.empty{padding:25px 0;color:var(--muted)}footer{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:11px}@media(max-width:600px){main{margin:20px auto;padding:0 16px}header{gap:10px;flex-wrap:wrap}h1{font-size:20px}header input{flex-basis:100%;order:2}.turns{padding-left:12px}.turn::before{left:-13px;width:7px}.date{display:none}.conversation{padding-left:8px}.label{font-size:13px}.toolbar{flex-wrap:wrap}}
</style>
</head>
<body><main>
<header><h1>对话目录</h1><input id="search" type="search" aria-label="检索 Session、Turn 和对话" placeholder="搜索 Session、Turn、ID 或对话内容…"><button id="refresh" type="button">刷新</button></header>
<div class="toolbar"><span id="count" aria-live="polite">正在加载…</span><button id="expand" type="button">展开</button><button id="collapse" type="button">折叠</button></div>
<p id="status" role="status"></p><div id="tree"></div><footer>Session → Turn → 对话 · 点击轮次查看提问与回复</footer>
</main>
<script>
let sessions=[];const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);$('search').value=params.get('q')||'';const opened=new Set();let collapsed=false;let activeQuery=$('search').value.trim();let requestController;let searchTimer;let generation=0;const closedSessions=new Set();
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
function highlight(el,text,terms){if(!terms.length){el.append(document.createTextNode(text));return}const escaped=terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));const re=new RegExp(escaped.join('|'),'ig');let pos=0;for(const m of text.matchAll(re)){el.append(document.createTextNode(text.slice(pos,m.index)),node('mark','',m[0]));pos=m.index+m[0].length}el.append(document.createTextNode(text.slice(pos)))}
function inline(el,text,terms){const re=/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g;let pos=0;for(const m of text.matchAll(re)){highlight(el,text.slice(pos,m.index),terms);const token=m[0];let part;if(token.startsWith('`')){part=node('code');highlight(part,token.slice(1,-1),terms)}else if(token.startsWith('**')){part=node('strong');highlight(part,token.slice(2,-2),terms)}else{const link=/^\[([^\]]+)\]\(([^)]+)\)$/.exec(token);let href=link[2];const local=/\/(pages|videos)\/([^/]+\.html)$/.exec(href);if(local){try{href='/'+local[1]+'/'+encodeURIComponent(decodeURIComponent(local[2]))}catch{href='/'+local[1]+'/'+encodeURIComponent(local[2])}}if(/^(https?:\/\/|\/(?:pages|videos)\/)/i.test(href)){part=node('a');part.href=href;highlight(part,link[1],terms)}else{part=node('span');highlight(part,link[1],terms)}}el.append(part);pos=m.index+token.length}highlight(el,text.slice(pos),terms)}
function body(text,terms){const result=node('div','body');const chunks=text.split(/(```[^\n]*\n[\s\S]*?```)/g);for(const chunk of chunks){if(!chunk)continue;if(chunk.startsWith('```')){const pre=node('pre'),code=node('code');highlight(code,chunk.replace(/^```[^\n]*\n/,'').replace(/```$/,''),terms);pre.append(code);result.append(pre)}else for(const paragraph of chunk.split(/\n\s*\n/)){const p=node('p');inline(p,paragraph,terms);result.append(p)}}return result}
function draw(){const q=activeQuery,terms=q.toLocaleLowerCase().split(/\s+/).filter(Boolean);const root=$('tree');root.replaceChildren();let sessionCount=0,turnCount=0;
for(const session of sessions){const turns=session.turns;const legacy=session.pages;if(!turns.length&&!legacy.length)continue;sessionCount++;turnCount+=session.totalTurns;
const group=node('details','session');group.open=(!collapsed&&!closedSessions.has(session.sessionId))||Boolean(q);group.addEventListener('toggle',()=>{if(!group.isConnected)return;group.open?closedSessions.delete(session.sessionId):closedSessions.add(session.sessionId)});const summary=node('summary');const title=node('span','label');highlight(title,session.title,terms);summary.append(title,node('span','badge',session.totalTurns?`${turns.length}/${session.totalTurns} 轮`:legacy.length+' 个历史页面'));summary.title=session.sessionId;group.append(summary);const list=node('div','turns');
for(const turn of turns){const key=session.sessionId+':'+turn.turnId;const d=node('details','turn');d.dataset.key=key;d.open=opened.has(key)||Boolean(q);d.ontoggle=()=>{d.open?opened.add(key):opened.delete(key)};const heading=node('summary');heading.append(node('span','number',turn.turnNumber?'#'+turn.turnNumber:'—'));if(turn.pages.length){const links=node('span','turn-pages');for(const [index,page] of turn.pages.entries()){const link=node('a','turn-page',turn.pages.length===1?'页面 ↗':`页面 ${index+1} ↗`);link.href='/'+page.path;link.target='_blank';link.rel='noopener';link.title=page.title;link.setAttribute('aria-label','打开生成页面：'+page.title);link.addEventListener('click',event=>event.stopPropagation());links.append(link)}heading.append(links)}const label=node('span','label');highlight(label,turn.turnTitle||'未记录提问',terms);heading.append(label);const date=node('time','date',new Date(turn.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));heading.append(date);heading.title=turn.turnId;d.append(heading);
const conversation=node('div','conversation');for(const message of turn.messages||[]){const section=node('section','message '+message.role);section.append(node('div','role',message.role==='user'?'你':'助手'),body(message.text,terms));conversation.append(section)}if(!(turn.messages||[]).some(m=>m.role==='assistant'))conversation.append(node('p','note',(turn.messages||[]).length?'该轮尚无最终回复，或回复记录不可用。':'该轮对话记录不可用。'));
const ids=node('details','ids');ids.append(node('summary','','标识'),node('div','','Session: '+session.sessionId),node('div','','Turn: '+turn.turnId));conversation.append(ids);d.append(conversation);list.append(d)}
if(session.hasMore){const more=node('button','load-more',`加载更多（剩余 ${session.totalTurns-turns.length} 轮）`);more.type='button';more.onclick=()=>loadMore(session,more);list.append(more)}
for(const page of legacy){const item=node('div','legacy'),a=node('a','',page.title+' ↗');a.href='/'+page.path;item.append(a);list.append(item)}group.append(list);root.append(group)}
$('count').textContent=`${sessionCount} 个 Session · ${turnCount} 个 Turn`;if(!sessionCount)root.append(node('p','empty','没有匹配的对话。'));const url=new URL(location.href);q?url.searchParams.set('q',q):url.searchParams.delete('q');history.replaceState(null,'',url)}
async function load(){
  const current=++generation;const q=$('search').value.trim();requestController?.abort();requestController=new AbortController();
  try{$('status').textContent=q?'正在搜索…':'';const r=await fetch('/api/conversations?'+new URLSearchParams({q}),{signal:requestController.signal});if(!r.ok)throw Error(r.status);const data=await r.json();if(current!==generation)return;sessions=data;activeQuery=q;$('status').textContent='';draw()}
  catch(e){if(e.name==='AbortError'||current!==generation)return;$('status').textContent='加载失败，请刷新重试。';console.error(e)}
}
async function loadMore(session,button){
  const current=generation;button.disabled=true;button.textContent='加载中…';
  try{const r=await fetch('/api/conversations?'+new URLSearchParams({session:session.sessionId,offset:String(session.turns.length),q:activeQuery}));if(!r.ok)throw Error(r.status);const next=(await r.json())[0];if(current!==generation)return;if(!next)throw Error('Session no longer available');const ids=new Set(session.turns.map(t=>t.turnId));session.turns.push(...next.turns.filter(t=>!ids.has(t.turnId)));session.totalTurns=next.totalTurns;session.hasMore=next.hasMore;const y=window.scrollY;draw();window.scrollTo(0,y)}
  catch(e){if(current!==generation)return;button.disabled=false;button.textContent='加载失败，点击重试';console.error(e)}
}
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,180)});$('refresh').onclick=()=>{clearTimeout(searchTimer);load()};$('expand').onclick=()=>{collapsed=false;closedSessions.clear();for(const s of sessions)for(const t of s.turns)opened.add(s.sessionId+':'+t.turnId);draw()};$('collapse').onclick=()=>{collapsed=true;opened.clear();draw()};load();
</script></body></html>
